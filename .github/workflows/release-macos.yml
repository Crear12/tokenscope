name: Build macOS app releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packager
        run: python -m pip install -r requirements-build.txt
      - name: Build and package app
        run: bash scripts/build_macos_app.sh
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: TokenScope-macOS-${{ matrix.arch }}
          path: release-output/TokenScope-${{ github.ref_name }}-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: TokenScope-macOS-*
          merge-multiple: true
      - name: Create release and attach app downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/*.zip --title "TokenScope $TAG" --generate-notes
