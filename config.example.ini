[source:local]
transport = local
database = ~/.cc-switch/cc-switch.db
# Default true: derive response-window TPS from native Codex logs on this host.
# Set false to skip this scan; the browser also has an independent display switch.
codex_native_tps = true
# Optional: semicolon-separated native session directories on this source host.
codex_session_roots = ~/.codex/sessions;~/.codex/archived_sessions
